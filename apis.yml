aid: moneybox
name: Moneybox
description: >-
  Moneybox is a London-based digital wealth management company, operating as Digital Moneybox
  Limited, whose mobile app helps people in the United Kingdom save and invest — round-ups on
  everyday spending, Stocks & Shares ISAs, Cash ISAs, Lifetime ISAs, general investment accounts,
  savings accounts and personal pensions including pension consolidation. It is authorised and
  regulated by the Financial Conduct Authority and appears in the UK Open Banking app directory as
  an account aggregator, meaning it CONSUMES bank open banking APIs to read customer transactions
  rather than publishing an API of its own. As profiled on 2026-08-26, Moneybox runs no public
  developer program: no developer portal, API reference, machine-readable specification, SDK,
  sandbox or partner API surface exists on any Moneybox-controlled host. The one machine-readable
  artifact it publishes is an RFC 9116 security.txt served from every moneyboxapp.com host.
